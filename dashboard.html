<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Localhost Dashboard</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #1a1d24;
      --panel-2: #232733;
      --border: #2c313c;
      --text: #e6e9ef;
      --muted: #8b93a3;
      --accent: #5b9dff;
      --good: #3ecf8e;
      --bad: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      position: sticky; top: 0; z-index: 5;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      padding: 14px 20px;
      background: rgba(15,17,21,.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 16px; margin: 0; font-weight: 600; }
    .spacer { flex: 1; }
    input, button, textarea {
      font: inherit; color: var(--text);
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 10px;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #0a0d12; border-color: var(--accent); font-weight: 600; }
    label.small { color: var(--muted); font-size: 12px; }
    #ports { width: 320px; }
    .status { color: var(--muted); font-size: 12px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
      padding: 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .card-head {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .card-head:hover .title { color: var(--accent); }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .dot.up { background: var(--good); }
    .dot.down { background: var(--bad); }
    .port { font-weight: 600; }
    .title { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-head .copy { margin-left: auto; padding: 2px 6px; font-size: 12px; line-height: 1; background: var(--panel-2); }
    .card-head .copy.copied { color: var(--good); border-color: var(--good); }
    .card-head .kill { padding: 2px 7px; font-size: 12px; line-height: 1; background: var(--panel-2); color: var(--bad); }
    .card-head .kill:hover { background: var(--bad); color: #fff; }
    .card.killing { opacity: .5; pointer-events: none; }
    .card-head a { color: var(--accent); text-decoration: none; font-size: 12px; flex: none; }
    .preview {
      position: relative;
      aspect-ratio: 16 / 10;
      background: var(--panel-2);
    }
    .preview iframe {
      position: absolute; top: 0; left: 0;
      width: 1280px; height: 800px;   /* render at desktop width, scaled to fit by JS */
      border: 0;
      transform: scale(var(--frame-scale, .28));
      transform-origin: 0 0;
      background: #fff;
    }
    .preview .overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 16px;
      color: var(--muted); font-size: 13px;
    }
    .preview .overlay[hidden] { display: none; }
    .empty { color: var(--muted); padding: 40px 20px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>🛰️ Localhost Dashboard</h1>
    <label class="small">Ports / ranges:</label>
    <input id="ports" placeholder="3000-3010, 5173, 8080, 8000" />
    <button id="scan" class="primary">Scan</button>
    <label class="small"><input type="checkbox" id="auto" /> auto-refresh 10s</label>
    <span class="spacer"></span>
    <span class="status" id="status"></span>
  </header>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>No services responded. Start a dev server and hit Scan.</div>
  <script src="dashboard.js"></script>
</body>
</html>
